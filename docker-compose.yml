services:
  # ────────────────────────────────────────────────────────
  # Controller Node
  # ────────────────────────────────────────────────────────
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    container_name: controller
    ports:
      - "8000:8000"
    networks:
      - object-store-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────
  # Worker Nodes (4 workers, each with persistent storage)
  # ────────────────────────────────────────────────────────
  worker1:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker1
    environment:
      - WORKER_ID=worker1
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - STORAGE_DIR=/data/chunks
      - WORKER_ADVERTISE_URL=http://worker1:8001
    volumes:
      - worker1-data:/data/chunks
    networks:
      - object-store-net
    depends_on:
      - controller
    restart: unless-stopped
    ports:
      - "8001:8001"

  worker2:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker2
    environment:
      - WORKER_ID=worker2
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - STORAGE_DIR=/data/chunks
      - WORKER_ADVERTISE_URL=http://worker2:8001
    volumes:
      - worker2-data:/data/chunks
    networks:
      - object-store-net
    depends_on:
      - controller
    restart: unless-stopped
    ports:
      - "8002:8001"

  worker3:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker3
    environment:
      - WORKER_ID=worker3
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - STORAGE_DIR=/data/chunks
      - WORKER_ADVERTISE_URL=http://worker3:8001
    volumes:
      - worker3-data:/data/chunks
    networks:
      - object-store-net
    depends_on:
      - controller
    restart: unless-stopped
    ports:
      - "8003:8001"

  worker4:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker4
    environment:
      - WORKER_ID=worker4
      - WORKER_PORT=8001
      - CONTROLLER_URL=http://controller:8000
      - STORAGE_DIR=/data/chunks
      - WORKER_ADVERTISE_URL=http://worker4:8001
    volumes:
      - worker4-data:/data/chunks
    networks:
      - object-store-net
    depends_on:
      - controller
    restart: unless-stopped
    ports:
      - "8004:8001"

networks:
  object-store-net:
    driver: bridge

volumes:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data: